databaseChangeLog:
  - changeSet:
      id: 1
      author: jb303
      changes:
        - createTable:
            tableName: EMPLOYEES
            columns:
              - column:
                  name: employeeid
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: firstname
                  type: VARCHAR(255)
              - column:
                  name: lastname
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    unique: true

micronaut:
  application:
    name: hr-service
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**

datasources:
  default:
    url: jdbc:h2:mem:hr_db;DB_CLOSE_DELAY=-1;MODE=Oracle
    driverClassName: org.h2.Driver
    username: sa
    password: ""

liquibase:
  datasources:
    default:
      change-log: 'classpath:db/changelog/db.changelog-master.yaml'
databaseChangeLog:
  - changeSet:
      id: loadData-REGIONS
      author: James Beardsley
      changes:
        - loadUpdateData:
            columns:
              - column:
                  name: REGION_ID
                  type: NUMERIC
              - column:
                  name: REGION_NAME
                  type: STRING

databaseChangeLog:
  - changeSet:
      id: loadData-POKEMON
      author: James Beardsley
      changes:
        - loadUpdateData:
            columns:
            - column:
                name: ID
                type: NUMBER
            - column:
                name: IDENTIFIER
                type: VARCHAR2(50)
            - column:
                name: SPECIES_ID
                type: NUMBER

- changeSet:
    id: 20
    author: generateChangeLog (generated)
    changes:
    - createView:
        fullDefinition: true
        selectQuery: |-
          CREATE VIEW CATCHES_VIEW AS
          SELECT 
          c.catch_id, c.species_id
          ,c.is_shiny ,c.userUUID
          ,CASE 
          WHEN c.is_shiny = TRUE THEN '✨'
          ELSE null
          END AS shiny_icon
          ,n.NAME POKEMON_NAME, n.GENUS
          ,(c.IVS_ATTACK + c.IVS_DEFENSE + c.IVS_STAMINA) * 100 / 45 as IVS_PERCENT,
          c.IVS_ATTACK, c.IVS_DEFENSE, c.IVS_STAMINA
          ,RAWTOHEX(HASH('MD5', b.BLOB)) BLOB_MD5, b.BLOB
          FROM CATCHES c, POKEMON_SPECIES_NAMES n, BLOB b
          where 
          c.SPECIES_ID = n.POKEMON_SPECIES_ID
          and n.LOCAL_LANGUAGE_ID = 9
          and b.SPECIES_ID = c.SPECIES_ID
          and b.IS_SHINY = c.IS_SHINY
        viewName: CATCHES_VIEW
    - createView:
        fullDefinition: true
        selectQuery: |-
          CREATE VIEW BLOBS_VIEW AS
          select 
          ROWNUM() AS ID, u.*
          from (
          select
          'normal' as IDENTIFIER
          , ID as SPECIES_ID
          , FALSE as IS_SHINY
          , 'data/sprites/normal/' || ID || '.png' as BLOB
          from POKEMON_SPECIES
          union all
          select
          'shiny' as IDENTIFIER
          , ID as SPECIES_ID
          , TRUE as IS_SHINY
          , 'data/sprites/shiny/' || ID || '.png' as BLOB
          from POKEMON_SPECIES
          ) u
        viewName: BLOBS_VIEW

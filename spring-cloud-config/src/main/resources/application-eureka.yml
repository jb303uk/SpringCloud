server:
  port: 0
spring:
  cloud:
    config:
      discovery:
        enabled: true
        service-id: spring-cloud-config
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://${HOSTNAME}.columbus.local:8761/eureka}
  instance:
    hostname: ${HOSTNAME}.columbus.local
    instanceId: "@project.artifactId@:${random.int[1,9]}"
---
spring:
  config:
    activate:
      on-cloud-platform: kubernetes
eureka:
  client:
    serviceUrl:
      defaultZone: http://spring-cloud-service-discovery:8080/eureka/
  instance:
    hostname: ${HOSTNAME}
    instanceId: ${HOSTNAME}

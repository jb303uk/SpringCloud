spring.application.name=spring-web-standalone
server.server-header=
server.port=8081
#management.endpoints.web.exposure.exclude=*
#spring.web.resources.static-locations=classpath:static
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false
server.error.include-message=false
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.prefix=stdout
server.tomcat.accesslog.directory=/dev
server.tomcat.accesslog.suffix=
server.tomcat.accesslog.rotate=false
server.tomcat.accesslog.pattern=common
spring.cloud.function.definition=fn
# All functional beans will now require the /api/ prefix (e.g., http://localhost:8080/api/home)
spring.cloud.function.web.path=/fn

# Tell Spring Cloud Function to ignore standard static paths
spring.cloud.function.web.ignored-paths=/index.html,/css/**,/js/**,/images/**

spring.cloud.function.web.export.contentType=text/html

server:
  port: 0
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    registerWithEureka: true
    fetchRegistry: true
  instance:
    hostname: ${HOSTNAME}.columbus.local
    instanceId: "@project.artifactId@:${random.int[1,99]}"
spring:
  config:
    import: "optional:configserver:"
  cloud:
    config:
      discovery:
        service-id: spring-cloud-config
        enabled: true
  application:
    name: "@project.artifactId@"
